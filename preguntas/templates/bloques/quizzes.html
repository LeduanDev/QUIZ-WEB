<div class="container mx-auto px-4 py-8">
  <!-- Grid de quizzes -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
    {% for categoria in categorias %}
    <div class="relative overflow-hidden rounded-lg shadow-lg transition-transform transform hover:scale-105 hover:shadow-xl max-w-xs mx-auto">
      <a href="{% url 'details' categoria.id %}">
        <img src="{{ categoria.image.url }}" alt="{{ categoria.nombre }}" class="w-full h-60 object-contain transition-opacity duration-300 hover:opacity-90">
      </a>
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
        <h3 class="text-white text-lg font-semibold">{{ categoria.nombre }}</h3>
      </div>
    </div>
    {% empty %}
    <p class="text-gray-600">No hay quizzes disponibles.</p>
    {% endfor %}
  </div>
</div>
